[project]
name = "rtfmup"
version = "0.5.0"
description = "Set up any repo from its README."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "xb17", email = "10093951+xb17@users.noreply.github.com" }
]
# 3.11+ gives us stdlib tomllib for reading pyproject.toml/Cargo.toml in later passes;
# 3.10 reached end of life in October 2026.
requires-python = ">=3.11"
dependencies = [
    "docutils>=0.23",
    "markdown-it-py>=4.2.0",
    "packaging>=26.3",
    "platformdirs>=4.14.5",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.28.0",
]
keywords = ["setup", "readme", "cli", "developer-tools", "bootstrap"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/xb17/rtfmup"
Repository = "https://github.com/xb17/rtfmup"
Issues = "https://github.com/xb17/rtfmup/issues"

[project.scripts]
rtfmup = "rtfmup.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e and not provider_e2e'"
markers = [
    "e2e: runs `rtfmup up` for real on a synthetic fixture (Windows); opt in with -m e2e",
    "provider_e2e: installs a runtime through a real provider; GitHub windows-latest only",
]


[tool.ruff]
# docs/*.md hold pseudo-code in python fences; ruff 0.17 would try to format it.
extend-exclude = ["docs", "*.md"]
