# T3.8: the e2e benchmark. Executes third-party setup steps from real READMEs,
# so it runs only on ephemeral runners: one fresh VM per repo. Manual trigger.
name: bench-e2e

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Space-separated corpus names (blank = every e2e repo)"
        required: false
        default: ""

jobs:
  pick:
    if: github.repository == 'xb17/rtfmup'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      repos: ${{ steps.pick.outputs.repos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        env:
          WANTED: ${{ inputs.repos }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, tomllib
          repos = tomllib.load(open("bench/corpus.toml", "rb"))["repo"]
          e2e = [r["name"] for r in repos if r.get("e2e")]
          wanted = os.environ["WANTED"].split()
          unknown = sorted(set(wanted) - set(e2e))
          if unknown:
              raise SystemExit(f"not e2e repos: {unknown}")
          print("repos=" + json.dumps(wanted or e2e))
          EOF

  e2e:
    needs: pick
    if: github.repository == 'xb17/rtfmup'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.pick.outputs.repos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv sync --locked
      - name: e2e ${{ matrix.repo }}
        env:
          REPO: ${{ matrix.repo }}
        run: uv run python bench/e2e.py --only "$env:REPO"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.repo }}
          path: bench/results/e2e-*.md
          if-no-files-found: warn
